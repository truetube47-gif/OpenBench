version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openbench-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - WOLFRAM_APP_ID=${WOLFRAM_APP_ID:-}
      - WOLFRAM_CLOUD_KEY=${WOLFRAM_CLOUD_KEY:-}
      - OPENBENCH_DATABASE_URL=sqlite+aiosqlite:///./data/openbench.db
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openbench-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
